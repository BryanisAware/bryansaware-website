
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b18">
  <title>Bryans Authentic Awareness</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #02050c, #102b56, #02050c);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 750px; }
    h1 {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      color: #76c8ff;
      text-shadow: 0 0 25px #1579e8;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.7;
      color: #d5e7ff;
    }
    .tagline {
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9ccfff;
    }
  </style>
</head>
<body>
  <main>
    <p class="tagline">Awareness is my authority</p>
    <h1>Bryans Authentic Awareness</h1>
    <p>
      Welcome to a space dedicated to awareness,
      restoration, personal growth, and conscious living.
    </p>
    <p>Our journey begins here.</p>
  </main>
</body>
</html>
